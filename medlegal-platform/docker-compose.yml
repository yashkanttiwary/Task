version: "3.9"
services:
	postgres:
		image: postgres:16
		container_name: medlegal-postgres
		environment:
			POSTGRES_PASSWORD: postgres
			POSTGRES_USER: postgres
			POSTGRES_DB: postgres
		ports:
			- "5432:5432"
		volumes:
			- pgdata:/var/lib/postgresql/data
		restart: unless-stopped

	adminer:
		image: adminer:4
		container_name: medlegal-adminer
		ports:
			- "8080:8080"
		depends_on:
			- postgres
		restart: unless-stopped

volumes:
	pgdata: